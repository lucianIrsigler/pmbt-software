name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm format:check

      - run: pnpm test

      # The scripts the production tools image runs, bundled: catches anything esbuild can't.
      - run: pnpm build:tools

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: daisyhealing
          POSTGRES_PASSWORD: daisyhealing
          POSTGRES_DB: daisyhealing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U daisyhealing -d daisyhealing"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgres://daisyhealing:daisyhealing@localhost:5432/daisyhealing
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test:int

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: daisyhealing
          POSTGRES_PASSWORD: daisyhealing
          POSTGRES_DB: daisyhealing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U daisyhealing -d daisyhealing"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgres://daisyhealing:daisyhealing@localhost:5432/daisyhealing
      APP_URL: http://localhost:3100
      IP_HASH_SECRET: ci-only-secret-at-least-32-characters-long
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm test:e2e

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
